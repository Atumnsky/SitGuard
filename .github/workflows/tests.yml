name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependency
        run: python -m pip install numpy
      - name: Run core unit tests
        run: python -m unittest discover -s tests -p "test_engine.py" -v
      - name: Run frame-health tests
        run: python -m unittest discover -s tests -p "test_health.py" -v
      - name: Run activity-log tests
        run: python -m unittest discover -s tests -p "test_daylog.py" -v
